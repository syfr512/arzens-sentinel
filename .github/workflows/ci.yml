name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Verify zero-network CSV export
        run: pnpm cli -- --demo --format csv --output ./reports-ci
